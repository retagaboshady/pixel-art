<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>My Pixel Art Studio</title>
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="dark-theme">
    <div class="app-container">
        
        <div class="sidebar">
            <section>
                <h2>Your Tools</h2>
                <div class="tool-group">
                    <input value="#e74c3c" type="color" id="colorPicker">
                    <span class="tool-label">Brush Color</span>
                </div>
                
                <div class="button-grid">
                    <button class="active" id="drawTool">✏️ Paintbrush</button>
                    <button id="eraseTool">🧽 Eraser</button>
                    <button id="fillTool">🪣 Paint Bucket</button>
                    <button id="pickerTool">🧪 Color Eyedropper</button>
                </div>
            </section>
            
            <hr/>
            
            <section>
                <h2>Canvas Settings</h2>
                <div class="select-group">
                    <label for="sizeSelector">Grid Size:</label>
                    <select id="sizeSelector">
                        <option value="16">16 x 16 (Simple & Quick)</option>
                        <option selected="selected" value="32">32 x 32 (Perfect Balance)</option>
                        <option value="64">64 x 64 (Detailed Masterpiece)</option>
                    </select>
                </div>
                <button id="toggleGrid">🌐 Hide/Show Gridlines</button>
                <button id="clearBtn" class="danger">🗑️ Wipe Canvas Clean</button>
            </section>
            
            <hr />
            
            <section>
                <h2>Mistakes happen...</h2>
                <div class="button-grid">
                    <button id="undoBtn">↩️ Undo last move</button>
                    <button id="redoBtn">↪️ Redo action</button>
                </div>
            </section>
            
            <hr/>
            
            <section>
                <h2>Save & Share</h2>
                <button id="exportPngBtn" class="success">🖼️ Download as PNG Image</button>
                <button id="exportJsonBtn">💾 Save Project File (JSON)</button>
                <button id="importJsonBtn">📂 Load Old Project (JSON)</button>
                <input id="fileInput" type="file" accept=".json" style="display:none">
            </section>
            
            <hr />
            <button id="themeToggle">🌓 Switch Light/Dark Mode</button>
        </div>

        <div class="workspace">
            <header class="palette-bar">
                <div class="palette-group">
                    <span>Classic Retro:</span>
                    <div style="background:#000" class="swatch" title="Black"></div>
                    <div style="background:#fff" class="swatch" title="White"></div>
                    <div style="background:#ff0000" class="swatch" title="Red"></div>
                    <div style="background:#0000ff" class="swatch" title="Blue"></div>
                    <div style="background:#00ff00" class="swatch" title="Green"></div>
                    <div style="background:#ffff00" class="swatch" title="Yellow"></div>
                </div>
                
                <div class="palette-group">
                    <span>Nostalgic GameBoy:</span>
                    <div style="background:#0f380f" class="swatch" title="Darkest Green"></div>
                    <div style="background:#306230" class="swatch" title="Dark Green"></div>
                    <div style="background:#8bac0f" class="swatch" title="Light Green"></div>
                    <div style="background:#9bbc0f" class="swatch" title="Lightest Green"></div>
                </div>
            </header>
            
            <main class="canvas-wrapper">
                <div class="grid show-grid" id="pixelGrid"></div>
            </main>
        </div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
